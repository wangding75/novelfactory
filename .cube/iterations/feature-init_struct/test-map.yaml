tasks:
  - task: "新建 Gradle Groovy DSL 的 Spring Boot 单体工程骨架，接入 Web、Validation、Actuator、OpenAPI、MyBatis-Plus 和 MySQL 依赖，并提供应用启动入口与基础资源配置。"
    module: com/novelfactory
    test_file: NovelFactoryApplicationTest.java
    test_cases: 1
  - task: "建立 `common` 公共层骨架，提供统一响应对象、错误码枚举、业务异常基类、全局异常处理器、系统验证接口以及基础配置类。"
    module: common
    test_file: CommonWebContractTest.java
    test_cases: 4
  - task: "建立 `book` 域骨架，覆盖书籍新增、列表、详情的 Controller、Service、Repository、Mapper、Entity、DTO 和状态枚举声明。"
    module: book/controller
    test_file: BookControllerWebTest.java
    test_cases: 4
  - task: "建立 `pipeline` 域骨架，覆盖流水线任务创建、任务查询的 Controller、Service、Repository、Mapper、Entity、DTO、任务类型和状态枚举声明。"
    module: pipeline/controller
    test_file: PipelineTaskControllerWebTest.java
    test_cases: 4
  - task: "建立 `agent` 域骨架，提供 `AgentOrchestrator` 接口、占位执行器以及执行请求/结果模型，供 `pipeline` 域同步调用。"
    module: agent/service
    test_file: StubAgentOrchestratorTest.java
    test_cases: 3
  - task: "建立 `book -> pipeline -> agent` 的最小跨组件调用签名，使“创建流水线任务”链路在代码结构上完整连通，但不实现业务逻辑。"
    module: integration
    test_file: PipelineTaskFlowIntegrationTest.java
    test_cases: 4
  - task: "补充本地开发与部署骨架，提供 `application.yml`、开发期数据库配置占位以及基础 `Dockerfile`。"
    module: config
    test_file: ApplicationConfigContractTest.java
    test_cases: 2
